<!doctype html>
<html lang="en" data-theme="culture" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calvin's Shenzhen List — 深圳清单</title>
    <meta
      name="description"
      content="A personal guide to Shenzhen: the restaurants, cafes, bars, parks and neighbourhoods worth your time. Curated by Calvin."
    />
    <meta property="og:title" content="Calvin's Shenzhen List" />
    <meta property="og:description" content="Where to eat, drink and wander in Shenzhen." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F7F3ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090B" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23B33A2B'/%3E%3Ctext x='16' y='23' font-family='Songti SC,SimSun,serif' font-size='18' font-weight='700' fill='%23F7F3ED' text-anchor='middle'%3E深%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Apply saved prefs before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('cis-theme');
          var lang = localStorage.getItem('cis-lang');
          if (!theme) {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'tech'
                : 'culture';
          }
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-lang', lang || 'en');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
